name: Build PhoneKey (Windows & Android)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # ====================================================================
  # JOB 1: Windows (Credential Provider C++ DLL, Service, WPF UI)
  # ====================================================================
  build-windows:
    name: Build Windows Binaries (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build C++ Credential Provider (PhoneKeyCP.dll)
        shell: cmd
        run: |
          msbuild windows\src\PhoneKey.CredentialProvider\PhoneKey.CredentialProvider.vcxproj /p:Configuration=Release /p:Platform=x64

      - name: Build .NET Solution (Service, Core, UI)
        shell: cmd
        run: |
          dotnet build windows\PhoneKey.sln -c Release

      - name: Run Cryptographic & Core Unit Tests
        shell: cmd
        run: |
          dotnet test tests\PhoneKey.Core.Tests\PhoneKey.Core.Tests.csproj -c Release --logger "console;verbosity=normal"

      - name: Stage Windows Release Bundle
        shell: pwsh
        run: |
          $dist = "dist\Windows-x64"
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          
          # Find and copy C++ Credential Provider DLL
          $dll = (Get-ChildItem -Path "windows" -Filter "PhoneKeyCP.dll" -Recurse | Select-Object -First 1).FullName
          Copy-Item $dll -Destination $dist -Force
          
          # Copy .NET Windows Service
          New-Item -ItemType Directory -Path "$dist\Service" -Force | Out-Null
          $serviceBin = (Get-ChildItem -Path "windows\src\PhoneKey.Service\bin" -Filter "PhoneKey.Service.exe" -Recurse | Select-Object -First 1).Directory.FullName
          Copy-Item "$serviceBin\*" -Destination "$dist\Service" -Recurse -Force
          
          # Copy .NET WPF Desktop UI
          New-Item -ItemType Directory -Path "$dist\UI" -Force | Out-Null
          $uiBin = (Get-ChildItem -Path "windows\src\PhoneKey.UI\bin" -Filter "PhoneKey.UI.exe" -Recurse | Select-Object -First 1).Directory.FullName
          Copy-Item "$uiBin\*" -Destination "$dist\UI" -Recurse -Force
          
          # Copy Registration & Unregistration Scripts
          Copy-Item "scripts\register_credential_provider.ps1" -Destination $dist -Force
          Copy-Item "scripts\unregister_credential_provider.ps1" -Destination $dist -Force
          Copy-Item "README.md" -Destination $dist -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PhoneKey-Windows-x64
          path: dist\Windows-x64\
          retention-days: 14

  # ====================================================================
  # JOB 2: Android (Kotlin, Jetpack Compose, Keystore APK)
  # ====================================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"
          cache-disabled: true

      - name: Build Android Debug APK
        working-directory: ./android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneKey-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
