name: Build PhoneKey (Windows & Android)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # ====================================================================
  # JOB 1: Windows (Credential Provider C++ DLL, Service, WPF UI)
  # ====================================================================
  build-windows:
    name: Build Windows Binaries (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build C++ Credential Provider (PhoneKeyCP.dll)
        shell: cmd
        run: |
          msbuild windows\src\PhoneKey.CredentialProvider\PhoneKey.CredentialProvider.vcxproj /p:Configuration=Release /p:Platform=x64

      - name: Build .NET Solution (Service, Core, UI)
        shell: cmd
        run: |
          dotnet build windows\PhoneKey.sln -c Release

      - name: Run Cryptographic & Core Unit Tests
        continue-on-error: true
        shell: cmd
        run: |
          dotnet test tests\PhoneKey.Core.Tests\PhoneKey.Core.Tests.csproj -c Release --logger "console;verbosity=normal"

      - name: Stage Windows Release Bundle
        shell: pwsh
        run: |
          $dist = "dist\Windows-x64"
          New-Item -ItemType Directory -Path "$dist\Service" -Force | Out-Null
          New-Item -ItemType Directory -Path "$dist\UI" -Force | Out-Null
          
          # Find and copy C++ Credential Provider DLL
          $dll = (Get-ChildItem -Path "windows\src\PhoneKey.CredentialProvider" -Filter "*.dll" -Recurse | Select-Object -First 1).FullName
          Write-Host "Found Credential Provider DLL at: $dll"
          Copy-Item $dll -Destination "$dist\PhoneKeyCP.dll" -Force
          
          # Publish .NET Windows Service
          Write-Host "Publishing Windows Service..."
          dotnet publish windows\src\PhoneKey.Service\PhoneKey.Service.csproj -c Release -r win-x64 --self-contained false -o "$dist\Service"
          
          # Publish .NET WPF Desktop UI
          Write-Host "Publishing WPF Desktop UI..."
          dotnet publish windows\src\PhoneKey.UI\PhoneKey.UI.csproj -c Release -r win-x64 --self-contained false -o "$dist\UI"
          
          # Copy Registration & Unregistration Scripts
          Copy-Item "scripts\register_credential_provider.ps1" -Destination $dist -Force
          Copy-Item "scripts\unregister_credential_provider.ps1" -Destination $dist -Force
          Copy-Item "README.md" -Destination $dist -Force
          
          Write-Host "Staging complete:"
          Get-ChildItem -Path $dist -Recurse | Select-Object FullName

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PhoneKey-Windows-x64
          path: dist\Windows-x64\
          retention-days: 14

  # ====================================================================
  # JOB 2: Android (Kotlin, Jetpack Compose, Keystore APK)
  # ====================================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"
          cache-disabled: true

      - name: Build Android Debug APK
        working-directory: ./android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneKey-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
